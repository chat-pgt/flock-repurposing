[project]
name = "flock-repurposing-experiments"
version = "0.1.0"
description = "CPU analyses and shared evaluation code for the FLOCK drug-repurposing study"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.5", "pandas==3.1.1", "scipy==1.18.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Published analyses: keep their logic and output byte-stable.
"paper_analysis/*" = ["B905", "E501", "E741", "UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
